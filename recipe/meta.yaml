{% set name = "abicheck" %}
{% set version = "0.5.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/abicheck/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 5daf5f0779d923359062493bedba7b7ec48448e38abf5243096df4cf1d887ade

build:
  number: 1
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=68,<75
  run:
    - python >={{ python_min }}
    - click >=8.0
    - rich-click >=1.7
    - pyyaml >=6.0
    - defusedxml >=0.7.1
    - pyelftools >=0.29
    - packaging >=21.0
    - pefile >=2023.2.7
    - macholib >=1.16
    - castxml >=0.6.3  # required for header/type analysis mode

test:
  imports:
    - abicheck
  commands:
    - abicheck --help
    - abicheck --version
    - abicheck dump --help
    - abicheck compare --help
    - abicheck scan --help
    - abicheck deps --help
    - abicheck compat --help
    - python -c "import abicheck.cli, abicheck.service, abicheck.reporter"
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/abicheck/abicheck
  summary: ABI/API compatibility checker for C/C++ libraries
  description: |
    abicheck compares releases of C/C++ libraries to reveal ABI and API changes,
    explain which changes can break existing consumers, and gate compatibility in
    CI. It combines binary metadata, debug information, public headers, build
    context, and optional source evidence, and reports what it could and could
    not verify.

    It supports ELF, PE/COFF, and Mach-O binaries; Markdown, JSON, SARIF, HTML,
    and JUnit reports; snapshot baselines; policy profiles and suppressions; and
    Python, command-line, and GitHub Action integrations.
  license: Apache-2.0
  license_file: LICENSE
  doc_url: https://abicheck.github.io/abicheck/
  dev_url: https://github.com/abicheck/abicheck

extra:
  recipe-maintainers:
    - napetrov
